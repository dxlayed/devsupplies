<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | DevSupplies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Outfit:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav id="nav"></nav>

<main class="auth">
  <div class="bloom"></div>
  <div class="laser"></div>
  <form class="auth-card" id="form" novalidate>
    <h1>Log in</h1>
    <p class="sub">Welcome back. Your balance and orders are waiting.</p>
    <div class="msg" id="err" role="alert"></div>
    <div class="field"><label class="label" for="user">Username</label><input class="input" id="user" type="text" autocomplete="username" autofocus></div>
    <div class="field"><label class="label" for="pass">Password</label><input class="input" id="pass" type="password" autocomplete="current-password"></div>
    <button class="btn btn-white btn-block" id="go" type="submit" style="margin-top:8px">Log in</button>
    <p class="auth-alt">New here? <a href="/signup" id="alt">Create an account</a></p>
  </form>
</main>

<footer id="footer"></footer>

<script src="/main.js"></script>
<script>
// Only allow going back to a page on this site
const next = (() => { const n = new URLSearchParams(location.search).get('next') || '/'; return n.startsWith('/') && !n.startsWith('//') ? n : '/'; })();
$('alt').href = '/signup' + location.search;

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  $('err').classList.remove('show');
  $('go').disabled = true;
  try {
    await api('POST', '/login', { username: $('user').value.trim().toLowerCase(), password: $('pass').value });
    location.href = next;
  } catch (err) {
    $('err').textContent = err.message; $('err').classList.add('show');
    $('go').disabled = false;
  }
});

startPage();
</script>
</body>
</html>
