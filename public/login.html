<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — devsupplies.cc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <a class="logo" href="/"><span class="logo-mark">D</span><span class="logo-text">devsupplies</span></a>
    <div class="top-actions"><a class="btn btn-quiet btn-sm" href="/">Back to shop</a></div>
  </header>

  <main class="auth">
    <form class="auth-card" id="form" novalidate>
      <div class="seg" role="tablist">
        <button type="button" id="tabLogin" role="tab" aria-selected="true">Log in</button>
        <button type="button" id="tabSignup" role="tab" aria-selected="false">Create account</button>
      </div>
      <div>
        <h1 id="title">Welcome back</h1>
        <p class="muted" id="subtitle">Log in with your username to check out.</p>
      </div>
      <label class="field"><span>Username</span><input name="username" required minlength="3" maxlength="20" autocomplete="username" autocapitalize="off" spellcheck="false"></label>
      <label class="field"><span>Password</span><input name="password" type="password" required maxlength="200" autocomplete="current-password"></label>
      <label class="field" id="confirmField" hidden><span>Confirm password</span><input name="confirm" type="password" maxlength="200" autocomplete="new-password"></label>
      <label class="field" id="codeField" hidden><span>Owner setup code</span><input name="code" autocomplete="off" placeholder="From data/setup-code.txt"></label>
      <p class="error" id="error" hidden></p>
      <button class="btn btn-primary btn-block" id="submit">Log in</button>
    </form>
  </main>

  <script src="common.js"></script>
  <script src="login.js"></script>
</body>
</html>
