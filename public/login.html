<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — devsupplies.cc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <a class="logo" href="/"><span class="logo-mark">D</span><span>dev<b>supplies</b></span></a>
    <a class="btn btn-outline btn-sm top-right" href="/">Back to shop</a>
  </header>

  <main class="auth">
    <form class="panel auth-card" id="form">
      <div class="seg" role="tablist">
        <button type="button" class="seg-btn" id="tabLogin" role="tab" aria-selected="true">Log in</button>
        <button type="button" class="seg-btn" id="tabSignup" role="tab" aria-selected="false">Create account</button>
      </div>
      <div>
        <h1 id="title">Welcome back</h1>
        <p class="muted" id="subtitle">Log in with your email to check out.</p>
      </div>
      <a class="btn btn-outline btn-block google-btn" href="/auth/google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span>Continue with Google</span>
      </a>
      <div class="or"><span>or use email</span></div>
      <label class="field"><span>Email</span><input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@gmail.com"></label>
      <label class="field"><span>Password</span><input name="password" type="password" required minlength="8" maxlength="200" autocomplete="current-password"></label>
      <label class="field" id="codeField" hidden><span>Owner setup code</span><input name="code" autocomplete="off" placeholder="From data/setup-code.txt"></label>
      <p class="error" id="error" hidden></p>
      <button class="btn btn-solid btn-block" id="submit">Log in</button>
    </form>
  </main>

  <script src="login.js"></script>
</body>
</html>
