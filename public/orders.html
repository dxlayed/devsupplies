<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | DevSupplies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav id="nav"></nav>

<div class="page">
  <div class="dash-top">
    <div>
      <div class="dash-title">My Orders</div>
      <div class="dash-sub">Your account details stay here. Copy them somewhere safe.</div>
    </div>
    <a class="btn btn-ghost" href="/">Back to Store</a>
  </div>
  <div id="list"><div class="empty">Loading...</div></div>
</div>

<footer id="footer"></footer>

<script src="/main.js"></script>
<script>
startPage().then(async () => {
  try {
    const orders = await api('GET', '/orders');
    $('list').innerHTML = orders.length ? orders.map(o => `
      <div class="order">
        <div class="order-top">
          <div>
            <div class="order-name">${esc(o.product)}</div>
            <div class="order-meta">Order #${o.id} · ${shortDate(o.created)} · ${money(o.price)}</div>
          </div>
          <span class="badge badge-${esc(o.status)}" style="align-self:flex-start">${esc(o.status)}</span>
        </div>
        ${o.content ? `
        <div class="row">
          <div class="codebox" style="flex:1;min-width:0">${esc(o.content)}</div>
          <button class="btn btn-ghost" data-copy="${esc(o.content)}" onclick="copyText(this.dataset.copy)">Copy</button>
        </div>` : ''}
      </div>`).join('') : '<div class="empty">No orders yet. <a href="/" style="color:var(--fg)">Browse products</a></div>';
  } catch (e) { $('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
});
</script>
</body>
</html>
