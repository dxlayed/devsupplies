<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My orders | DevSupplies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Outfit:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav id="nav"></nav>

<main class="page wrap" style="max-width:880px">
  <div class="page-head">
    <div>
      <h1>My orders</h1>
      <p>Your login details stay here. Copy them somewhere safe too.</p>
    </div>
  </div>
  <div id="list"><div class="empty">Loading your orders...</div></div>
</main>

<footer id="footer"></footer>

<script src="/main.js"></script>
<script>
startPage().then(async () => {
  try {
    const orders = await api('GET', '/orders');
    $('list').innerHTML = orders.length ? orders.map(o => `
      <article class="order">
        <div class="order-top">
          <div>
            <h2 class="order-name">${esc(o.product)}</h2>
            <p class="order-meta">Order #${o.id}, ${esc(shortDate(o.created))}</p>
          </div>
          <div style="display:flex;align-items:center;gap:12px">
            <span class="badge badge-${esc(o.status)}">${esc(o.status[0].toUpperCase() + o.status.slice(1))}</span>
            <span class="order-price">${money(o.price)}</span>
          </div>
        </div>
        ${o.content ? `
        <div class="row">
          <div class="codebox grow">${esc(o.content)}</div>
          <button class="btn btn-ghost" data-copy="${esc(o.content)}" onclick="copyText(this.dataset.copy)">Copy</button>
        </div>` : ''}
        <div style="margin-top:12px"><a class="small" href="/support?topic=order&order=${o.id}">Problem with this order? Get help</a></div>
      </article>`).join('') : '<div class="empty">No orders yet. <a href="/#accounts">Browse accounts</a> to make your first one.</div>';
  } catch (e) { $('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
});
</script>
</body>
</html>
