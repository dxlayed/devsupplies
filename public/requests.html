<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friend requests - Waurks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  .page{max-width:1080px;margin:0 auto;padding:0 20px 100px;position:relative}
  .pagehero{position:relative;text-align:center;padding:56px 0 34px;overflow:hidden}
  .pagehero::before{content:"";position:absolute;width:1100px;height:1100px;left:calc(50% - 550px);top:-640px;pointer-events:none;
    background:repeating-conic-gradient(from 0deg,rgba(139,92,246,.12) 0deg 6deg,transparent 6deg 18deg);
    -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:pgspin 40s linear infinite}
  @keyframes pgspin{to{transform:rotate(360deg)}}
  .pagehero > *{position:relative}
  .pagehero h1{font-size:clamp(40px,6vw,68px);letter-spacing:-.04em;line-height:1;margin:16px 0 14px}
  .pagehero h1 .count{-webkit-text-fill-color:#8f85a6}
  .status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
  .status::before{content:"";width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 10px #3ddc84}
  .status:empty{display:none}
  .status.bad{color:var(--red)} .status.bad::before{background:var(--red);box-shadow:0 0 10px var(--red)}
  .status.warnline{color:var(--yellow)} .status.warnline::before{background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
  .head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 26px;padding:14px 16px;border-radius:22px;
    background:rgba(20,13,34,.5);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 40px rgba(0,0,0,.35)}
  .head .left{display:flex;gap:8px;flex-wrap:wrap}

  .seg{display:inline-flex;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:4px}
  .seg button{background:none;border:none;color:var(--muted);font:600 13px "Inter",sans-serif;padding:8px 16px;border-radius:999px;cursor:pointer}
  .seg button.on{background:linear-gradient(160deg,#7c4dff,#4c1fb8);color:#fff;box-shadow:0 2px 0 #2a1170}
  .seg button{display:inline-flex;align-items:center;gap:8px}
  .seg button img{width:22px;height:22px;border-radius:6px;object-fit:cover}
  .seg-help{font-size:12px;color:var(--muted);margin-top:6px;text-align:right}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:16px}
  .card{background:linear-gradient(165deg,#140d22,#08050e);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.4)}
  .card:hover{border-color:rgba(139,92,246,.5)}
  .card .pic{width:110px;height:110px;border-radius:50%;background:#e9e6ef;object-fit:cover;margin:4px 0 12px;box-shadow:0 0 0 3px #2a1f40,0 0 30px rgba(139,92,246,.35)}
  .card .pic.ph{display:grid;place-items:center;font:700 34px "Space Grotesk",sans-serif;color:var(--muted)}
  .card .dn{font-weight:700;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .un{font-size:13px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .facts{font-size:12px;color:var(--muted);margin:8px 0 12px;min-height:32px}
  .card .facts b{color:var(--text);font-weight:600}
  .card .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:auto}
  .card .acts .btn{padding:9px 0}
  .card .why{font-size:12px;color:var(--red);margin:6px 0 10px}
  .card.gone{opacity:.4;pointer-events:none}
  .card a.who{display:flex;flex-direction:column;align-items:center;width:100%;color:inherit}
  .card a.who:hover .dn{color:var(--purple)}
  .controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .auto{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer}
  .warn{display:none;align-items:center;gap:8px;background:rgba(255,200,87,.1);border:1px solid rgba(255,200,87,.4);color:var(--yellow);
    border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
  .warn.show{display:inline-flex}
  .warn svg{width:16px;height:16px;flex:none}
  .linkish{background:none;border:none;color:var(--muted);font:12px "Inter",sans-serif;cursor:pointer;margin-top:8px;text-decoration:underline}
  .linkish:hover{color:var(--text)}

  .empty{background:linear-gradient(165deg,#140d22,#08050e);border:1px solid var(--line);border-radius:24px;padding:50px 24px;text-align:center;color:var(--muted);box-shadow:0 30px 60px rgba(0,0,0,.45)}
  .empty h2{color:var(--text)}
  .hidden-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:40px 0 16px;flex-wrap:wrap}
  .hidden-bar h2{font-size:24px;letter-spacing:-.02em}
  #hiddenList .card .pic{box-shadow:0 0 0 3px rgba(255,84,112,.35);filter:grayscale(.5)}
</style>
</head>
<body>
<div id="wkToast" role="status" aria-live="polite"></div>
<script>
  function notify(msg, kind) {
    const t = document.getElementById('wkToast');
    t.textContent = String(msg);
    t.className = 'show' + (kind ? ' ' + kind : (/error|fail|could not|didn't/i.test(msg) ? ' err' : ''));
    clearTimeout(t._h); t._h = setTimeout(() => { t.className = ''; }, 3000);
  }
</script>

<div class="wrap">
  <header class="topbar">
    <a href="/" class="logo"><span class="logo-mark">W</span>Waurks</a>
    <nav class="nav">
      <a href="/requests" style="color:var(--text)">Friend requests</a>
      <a href="/dashboard">My account</a>
      <a href="/admin" id="adminLink" class="admin-link" style="display:none">Admin</a>
      <a href="/checkout" class="btn btn-main btn-sm">Get a key</a>
    </nav>
  </header>
</div>

<main class="page">
  <div class="pagehero">
    <span class="pill">Live filter</span>
    <h1 class="grad3d">Friend requests <span class="count" id="count"></span></h1>
    <div class="status" id="status">Loading...</div>
  </div>
  <div class="head">
    <div>
      <div class="left">
        <button class="btn btn-line btn-sm" id="scanNow">Scan now</button>
        <a href="/api/v1/extension/download" class="btn btn-line btn-sm" download="waurks-extension.zip" title="Download browser extension">Download extension</a>
      </div>
    </div>
    <div class="controls">
      <label class="auto"><span>Auto-accept real people</span><span class="switch"><input type="checkbox" id="autoAccept"><span></span></span></label>
      <div class="seg" id="acceptFilter" aria-label="Game filter"><button data-filter="mm2"><img src="/img/mm2.webp" alt="">MM2</button><button data-filter="adoptme"><img src="/img/adoptme.webp" alt="">Adopt Me</button></div>
    </div>
  </div>

  <div id="list"></div>

  <div class="hidden-bar" id="hiddenBar" style="display:none">
    <h2 id="hiddenTitle">Filtered out</h2>
    <button class="btn btn-line btn-sm" id="toggleHidden">Show</button>
  </div>
  <div id="hiddenList" style="display:none"></div>
</main>

<script>
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const HELP = {
    relaxed: 'Only hides accounts we are sure are bots.',
    normal: 'Also hides accounts that look suspicious.',
    strict: 'Only shows accounts that clearly look real.'
  };
  let showHidden = false;
  let isAdmin = false;
  let busy = new Set();
  let lastData = null;

  function factsLine(f) {
    const bits = [];
    if (f.mutuals) bits.push(`<b>${+f.mutuals} mutual</b>`);
    if (f.paidItem) bits.push(`wears <b>${esc(f.paidItem)}</b>`);
    if (f.ageDays !== null && f.ageDays !== undefined) {
      bits.push(f.ageDays >= 365 ? `${Math.floor(f.ageDays / 365)} yr old` : `${f.ageDays} day${f.ageDays === 1 ? '' : 's'} old`);
    }
    if (f.badges !== null && f.badges !== undefined) bits.push(`${f.badges >= 25 ? '25+' : f.badges} badges`);
    if (f.friends !== null && f.friends !== undefined) bits.push(`${f.friends} friends`);
    return bits.join(' · ');
  }

  const profileUrl = id => 'https://www.roblox.com/users/' + encodeURIComponent(String(id).replace(/\D/g, '')) + '/profile';

  function pic(r) {
    return r.avatar
      ? `<img class="pic" src="${esc(r.avatar)}" alt="" loading="lazy">`
      : `<div class="pic ph">${esc((r.displayName || r.name || '?').charAt(0).toUpperCase())}</div>`;
  }

  function card(r, hiddenMode) {
    const off = busy.has(String(r.id)) ? ' gone' : '';
    if (hiddenMode) {
      const declined = r.status === 'declined';
      return `<div class="card${off}">
        <a class="who" href="${profileUrl(r.id)}" target="_blank" rel="noopener" title="Open Roblox profile">
          ${pic(r)}
          <div class="dn">${esc(r.displayName || r.name)}</div>
          <div class="un">@${esc(r.name)}</div>
        </a>
        <div class="why">${esc((r.reasons || [])[0] || 'Looks like a bot')}</div>
        ${declined ? '<div class="facts">Declined for you</div>'
          : `<div class="acts"><button class="btn btn-line btn-sm" data-act="accept" data-id="${esc(r.id)}">Accept</button><button class="btn btn-line btn-sm" data-act="decline" data-id="${esc(r.id)}">Decline</button></div>`}
      </div>`;
    }
    return `<div class="card${off}">
      <a class="who" href="${profileUrl(r.id)}" target="_blank" rel="noopener" title="Open Roblox profile">
        ${pic(r)}
        <div class="dn">${esc(r.displayName || r.name)}</div>
        <div class="un">@${esc(r.name)}</div>
      </a>
      <div class="facts">${factsLine(r.facts || {})}</div>
      <div class="acts">
        <button class="btn btn-main btn-sm" data-act="accept" data-id="${esc(r.id)}">Accept</button>
        <button class="btn btn-line btn-sm" data-act="decline" data-id="${esc(r.id)}">Decline</button>
      </div>
      ${isAdmin ? `<button class="linkish" data-act="bot" data-id="${esc(r.id)}">This is a bot (adds to block list)</button>` : ''}
    </div>`;
  }

  function render(d) {
    lastData = d;
    const sw = document.getElementById('autoAccept');
    if (document.activeElement !== sw) sw.checked = !!d.autoAccept;
    document.querySelectorAll('#acceptFilter button').forEach(b => b.classList.toggle('on', b.dataset.filter === (d.acceptFilter || 'mm2')));

    const st = document.getElementById('status');
    if (d.lastError) { st.textContent = 'Problem: ' + d.lastError; st.className = 'status bad'; }
    else if (!d.active) { st.textContent = 'Paused. Turn it back on from My account.'; st.className = 'status'; }
    else {
      const t = d.lastScanAt ? new Date(String(d.lastScanAt).replace(' ', 'T') + 'Z').toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' }) : null;
      const how = d.mode === 'extension' ? (d.extensionOnline ? 'Connected in your browser' : 'Browser extension not running') : 'Updates by itself';
      st.textContent = (d.checking ? `Checking ${d.checking > 1 ? d.checking + ' more' : 'more'} requests...` : how) + (t ? ` · last checked ${t}` : '');
      st.className = 'status' + (d.mode === 'extension' && !d.extensionOnline ? ' warnline' : '');
    }

    const reqs = d.requests || [];
    const hid = d.hidden || [];
    document.getElementById('count').textContent = reqs.length ? `(${reqs.length})` : '';
    document.getElementById('list').innerHTML = reqs.length
      ? `<div class="grid">${reqs.map(r => card(r, false)).join('')}</div>`
      : (d.mode === 'extension' && !d.extensionOnline && hid.length === 0
          ? `<div class="empty"><h2 style="font-size:18px;margin-bottom:8px">Waiting for browser extension...</h2><p class="muted" style="margin-bottom:18px">Make sure the Waurks extension is loaded in your browser and your key is saved.<br>Your Roblox friend requests will appear here automatically.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><a href="/api/v1/extension/download" class="btn btn-main btn-sm" download="waurks-extension.zip">Download Extension (.ZIP)</a><a href="/dashboard" class="btn btn-line btn-sm">Setup Guide</a></div></div>`
          : `<div class="empty">No friend requests from real people right now.<br>New ones show up here by themselves.</div>`);

    document.getElementById('hiddenBar').style.display = hid.length ? 'flex' : 'none';
    document.getElementById('hiddenTitle').textContent = `Filtered out (${hid.length})`;
    document.getElementById('toggleHidden').textContent = showHidden ? 'Hide' : 'Show';
    const hl = document.getElementById('hiddenList');
    hl.style.display = showHidden && hid.length ? 'block' : 'none';
    if (showHidden) hl.innerHTML = `<div class="grid">${hid.map(r => card(r, true)).join('')}</div>`;
  }

  async function load() {
    try {
      const r = await fetch('/api/v1/roblox/requests');
      if (r.status === 401) { try { localStorage.removeItem('waurks_req_cache'); } catch (e) {} location.href = '/checkout'; return; }
      const d = await r.json();
      if (!r.ok) {
        const st = document.getElementById('status');
        st.textContent = 'Problem loading your requests: ' + (d.error || ('error ' + r.status)) + '. Retrying...';
        st.className = 'status bad';
        return;
      }
      if (!d.connected && d.noKey) {
        document.getElementById('status').textContent = '';
        document.getElementById('list').innerHTML = `<div class="empty"><h2 style="font-size:24px;margin-bottom:8px">You need a key first</h2><p class="muted" style="margin-bottom:20px">Get a key to start filtering bots out of your friend requests.</p><a href="/checkout" class="btn btn-main">Get a key</a></div>`;
        return;
      }
      if (!d.connected) {
        document.getElementById('status').textContent = '';
        document.getElementById('list').innerHTML = `
          <div class="empty">
            <h2 style="font-size:20px;margin-bottom:8px">Connect via the Waurks Extension</h2>
            <p class="muted" style="max-width:480px;margin:0 auto 20px">No cookies or passwords required. Install our extension to sync friend requests safely with zero cookie logging.</p>
            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
              <a href="/api/v1/extension/download" class="btn btn-main" download="waurks-extension.zip">Download Extension (.ZIP)</a>
              <a href="/extension-source" target="_blank" class="btn btn-line">Inspect Extension Code</a>
              <a href="/dashboard" class="btn btn-line">My account</a>
            </div>
          </div>
        `;
        return;
      }
      render(d);
      try { localStorage.setItem('waurks_req_cache', JSON.stringify(d)); } catch (e) {}
    } catch (e) {}
  }

  document.getElementById('autoAccept').onchange = async e => {
    const on = e.target.checked;
    try {
      const r = await fetch('/api/v1/roblox/auto-accept', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: on }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      notify(on ? (d.accepted ? `Auto-accept on. Accepted ${d.accepted} real ${d.accepted === 1 ? 'person' : 'people'}.` : 'Auto-accept on') : 'Auto-accept off', 'ok');
    } catch (err) {
      e.target.checked = !on;
      notify(err.message || 'Could not change that', 'err');
    }
    load();
  };

  document.getElementById('scanNow').onclick = async e => {
    const b = e.currentTarget;
    b.disabled = true; b.textContent = 'Scanning...';
    try {
      const r = await fetch('/api/v1/roblox/scan-now', { method: 'POST' });
      const d = await r.json();
      if (r.status === 409) { notify('Already checking, results are coming in'); b.disabled = false; b.textContent = 'Scan now'; load(); return; }
      if (!r.ok) throw new Error(d.error);
      if (d.ext) { notify('Your browser extension will re-check everything in a few seconds', 'ok'); b.disabled = false; b.textContent = 'Scan now'; load(); return; }
      notify(d.scanned ? `Checked ${d.scanned}: ${d.botsDeclined} bots, ${d.playersAccepted} real` : 'No friend requests found', 'ok');
    } catch (err) {
      notify(err.message || 'Scan failed', 'err');
    }
    b.disabled = false; b.textContent = 'Scan now';
    load();
  };

  document.querySelectorAll('#acceptFilter button').forEach(b => b.onclick = async () => {
    if (b.classList.contains('on')) return;
    try {
      const r = await fetch('/api/v1/roblox/accept-filter', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ filter: b.dataset.filter }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      document.querySelectorAll('#acceptFilter button').forEach(x => x.classList.toggle('on', x === b));
      notify(b.dataset.filter === 'adoptme' ? 'Adopt Me filter on. Re-checking your requests...' : 'MM2 filter on. Re-checking your requests...', 'ok');
      try { localStorage.removeItem('waurks_req_cache'); } catch (e) {}
      load();
    } catch (err) { notify(err.message || 'Could not change the filter', 'err'); }
  });

  document.getElementById('toggleHidden').onclick = () => { showHidden = !showHidden; if (lastData) render(lastData); };

  document.addEventListener('click', async e => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    busy.add(id); if (lastData) render(lastData);
    try {
      const r = await fetch(`/api/v1/roblox/requests/${encodeURIComponent(id)}/${act}`, { method: 'POST' });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      notify(act === 'accept' ? 'Accepted' : act === 'bot' ? 'Added to the block list for everyone' : 'Declined', 'ok');
    } catch (err) {
      notify(err.message || 'Could not do that', 'err');
    }
    busy.delete(id);
    load();
  });

  fetch('/api/v1/auth/status').then(r => r.json()).then(s => {
    if (s.isAdmin) { document.getElementById('adminLink').style.display = ''; isAdmin = true; if (lastData) render(lastData); }
  }).catch(() => {});

  let pollTimeout = null;
  function schedulePoll() {
    clearTimeout(pollTimeout);
    const delay = (lastData && (lastData.checking > 0 || lastData.busy)) ? 1500 : 3000;
    pollTimeout = setTimeout(async () => {
      await load();
      schedulePoll();
    }, delay);
  }

  // Show the last list right away (saved on this device), then refresh it
  try { const c = JSON.parse(localStorage.getItem('waurks_req_cache') || 'null'); if (c && c.connected) render(c); } catch (e) {}
  load().then(() => schedulePoll());
</script>
<script src="/fx.js" defer></script>
</body>
</html>
